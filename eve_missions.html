<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Online - Missions</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Midnight base */
    --bg0: #0a0d14;
    --bg1: #0e121a;
    --bg2: #131822;
    --bg3: #1a2130;
    --border: rgba(148,163,184,0.09);
    --border-strong: rgba(148,163,184,0.18);
    --text0: #e7ebf2;
    --text1: #8b94a8;
    --text2: #4c5566;

    /* Salmon accent */
    --salmon: #e8917a;
    --salmon-dim: rgba(232,145,122,0.14);
    --salmon-line: rgba(232,145,122,0.35);

    /* Ammo Colors */
    --ammo-em: #4d84e8;
    --ammo-kin: #6b7480;
    --ammo-exp: #e8917a;
    --ammo-therm: #d9564a;

    /* Profitability */
    --prof-green: #57c98a;
    --prof-yellow: #d9b95c;
    --prof-blue: #4d84e8;
    --prof-white: #c7ccd6;
    --prof-orange: #e8917a;
    --prof-gray: #5b6472;
    --prof-red: #d9564a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    padding: 32px 36px;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(232,145,122,0.05), transparent 60%),
      var(--bg0);
    color: var(--text0);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }

  /* Header & Controls */
  .header-controls {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 22px;
    gap: 20px;
  }
  .header-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .header-controls h2 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text0);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .header-controls h2::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--salmon);
    box-shadow: 0 0 10px var(--salmon-line);
  }
  .header-controls .subtitle {
    color: var(--text2);
    font-size: 10.5px;
    font-weight: 400;
    margin-left: 2px;
  }
  .controls-right { display: flex; gap: 10px; align-items: center; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; }
  .tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text1);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tab:hover { background: var(--bg3); color: var(--text0); border-color: var(--border-strong); }
  .tab.active {
    background: var(--salmon-dim);
    border-color: var(--salmon-line);
    color: var(--salmon);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .search-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 13px;
    color: var(--text0);
    font-family: inherit;
    font-size: 12px;
    width: 260px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .search-box::placeholder { color: var(--text2); }
  .search-box:focus { border-color: var(--salmon-line); background: var(--bg3); }

  .btn {
    background: var(--salmon);
    color: #1a1210;
    border: none;
    border-radius: 7px;
    padding: 9px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    transition: filter 0.15s, transform 0.05s;
    white-space: nowrap;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text1);
  }
  .btn-outline:hover { background: var(--bg3); color: var(--text0); border-color: var(--text2); }
  .btn-danger {
    background: rgba(217,86,74,0.16);
    color: #f0897c;
    border: 1px solid rgba(217,86,74,0.35);
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--bg1);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  th, td {
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
    text-align: left;
    vertical-align: top;
    line-height: 1.55;
  }
  th {
    background: var(--bg2);
    color: var(--text1);
    font-weight: 600;
    letter-spacing: 0.06em;
    font-size: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border-strong);
  }
  tbody tr.mission-row { transition: background 0.1s; cursor: pointer; }
  tbody tr.mission-row:hover { background: rgba(255,255,255,0.018); }
  tbody tr:last-child td { border-bottom: none; }

  .actions-cell { display: flex; gap: 4px; }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text2);
    cursor: pointer;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 13px;
    transition: background 0.12s, color 0.12s;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text0); }
  .icon-btn.edit:hover { color: var(--salmon); }
  .icon-btn.delete:hover { color: #f0897c; }

  /* Expand chevron */
  .expand-cell { text-align: center; width: 28px; }
  .chevron {
    display: inline-block;
    color: var(--text2);
    font-size: 11px;
    transition: transform 0.15s, color 0.15s;
  }
  tr.mission-row:hover .chevron { color: var(--text1); }
  tr.mission-row.expanded .chevron { transform: rotate(90deg); color: var(--salmon); }

  /* Mission name cell — profitability shown as a left accent bar, not a full block fill */
  .mission-name-cell {
    position: relative;
    font-weight: 600;
    padding-left: 18px;
    color: var(--text0);
  }
  .mission-name-cell::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--dot-color, var(--text2));
  }

  .guide-cell { color: var(--text1); font-size: 12px; }
  .guide-cell br { content: ''; display: block; margin-top: 4px; }
  .guide-cell.truncated {
    max-width: 1px; /* forces the width from the colgroup/th, not this */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Ammo */
  .ammo-cell { text-align: center; font-weight: 600; letter-spacing: 0.03em; font-size: 11px; }
  .ammo-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 5px;
    background: var(--bg3);
  }
  .ammo-em { color: var(--ammo-em); }
  .ammo-kin { color: var(--ammo-kin); }
  .ammo-exp { color: var(--ammo-exp); }
  .ammo-therm { color: var(--ammo-therm); }

  .ab-yes { color: var(--prof-green); font-weight: 600; }
  .ab-no { color: var(--text2); font-weight: 600; }

  .empty-state, .loading-state {
    text-align: center;
    color: var(--text2);
    padding: 36px 20px !important;
    font-size: 12px;
  }

  /* Expandable detail row */
  tr.detail-row td {
    background: var(--bg2);
    padding: 0;
    border-bottom: 1px solid var(--border-strong);
  }
  .detail-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .detail-section {
    padding: 14px 20px;
  }
  .detail-section + .detail-section {
    border-left: 1px solid var(--border);
  }
  .detail-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .detail-label.tank { color: var(--salmon); }
  .detail-label.loot { color: var(--prof-green); }
  .detail-body {
    color: var(--text1);
    font-size: 12px;
    white-space: pre-wrap;
  }
  .detail-body.empty { color: var(--text2); font-style: italic; }

  /* Burners tab */
  .group-row td {
    background: var(--bg2);
    color: var(--text2);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border-strong);
  }
  .burner-row td {
    background: rgba(var(--rc), 0.13);
    border-bottom: 1px solid rgba(var(--rc), 0.18);
  }
  .burner-row:hover td { background: rgba(var(--rc), 0.22); }
  .burner-row td:first-child {
    border-left: 3px solid rgb(var(--rc));
    box-shadow: inset 0 0 0 0 transparent;
  }
  .burner-row:last-child td { border-bottom: none; }
  .burner-name {
    font-weight: 600;
    color: var(--text0);
    font-size: 12.5px;
  }
  .burner-row .ammo-chip { background: rgba(0,0,0,0.28); }
  .burner-sensor { color: var(--text1); font-size: 11.5px; letter-spacing: 0.03em; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(6,8,12,0.72);
    backdrop-filter: blur(2px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 26px;
    width: 460px;
    max-width: 90%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3 {
    margin-bottom: 18px;
    color: var(--text0);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal h3::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--salmon);
  }
  .form-group { margin-bottom: 15px; }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 0.06em;
  }
  .form-group input[type="text"],
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    color: var(--text0);
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-group input[type="text"]:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--salmon-line); }
  .form-group textarea { min-height: 96px; resize: vertical; }
  .form-group textarea.small { min-height: 64px; }
  .form-group select { cursor: pointer; }

  .checkbox-group {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text0);
    cursor: pointer;
  }
  .checkbox-group input[type="checkbox"] { accent-color: var(--salmon); }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg1); }
  ::-webkit-scrollbar-thumb { background: #2a3242; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4457; }
</style>
</head>
<body>

  <div class="header-controls">
    <div class="header-left">
      <h2>EVE Online<span class="subtitle">mission guide &amp; loadout reference</span></h2>
      <div class="tabs">
        <button class="tab active" data-tab="missions" onclick="switchTab('missions')">Missions</button>
        <button class="tab" data-tab="burners" onclick="switchTab('burners')">Burners</button>
      </div>
    </div>
    <div class="controls-right" id="mission-controls">
      <input type="text" id="search-bar" class="search-box" placeholder="Search missions..." oninput="searchMissions()">
      <button class="btn" onclick="openModal()">+ Add mission</button>
      <button class="btn btn-outline" onclick="exportMissions()" title="Download the current mission list as JSON to commit back to the repo">Export JSON</button>
    </div>
  </div>

  <!-- ===== Tab: Missions ===== -->
  <div class="tab-panel active" id="panel-missions">
    <table>
      <thead>
        <tr>
          <th class="expand-cell"></th>
          <th style="width: 18%;">Mission</th>
          <th style="width: 42%;">Guide</th>
          <th style="width: 14%;">Ammo</th>
          <th style="width: 9%; text-align: center;">AB</th>
          <th style="width: 10%; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="missions-tbody">
        <tr><td colspan="6" class="loading-state">Loading missions…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ===== Tab: Burners ===== -->
  <div class="tab-panel" id="panel-burners">
    <table>
      <thead>
        <tr>
          <th style="width: 30%;">Ship</th>
          <th style="width: 25%;">Ammo</th>
          <th style="width: 45%;">Sensor</th>
        </tr>
      </thead>
      <tbody>
        <tr class="group-row"><td colspan="3">TEAM BURNERS</td></tr>
        <tr class="burner-row" style="--rc: 232,145,122;">
          <td class="burner-name">Enyo</td>
          <td><span class="ammo-chip ammo-exp">EXP</span></td>
          <td class="burner-sensor">Magnetometric</td>
        </tr>
        <tr class="burner-row" style="--rc: 77,132,232;">
          <td class="burner-name">Hawk</td>
          <td><span class="ammo-chip ammo-em">EM</span></td>
          <td class="burner-sensor">Gravimetric</td>
        </tr>
        <tr class="burner-row" style="--rc: 107,116,128;">
          <td class="burner-name">Jaguar</td>
          <td><span class="ammo-chip ammo-kin">KIN</span></td>
          <td class="burner-sensor">Ladar</td>
        </tr>
        <tr class="burner-row" style="--rc: 217,86,74;">
          <td class="burner-name">Vengeance</td>
          <td><span class="ammo-chip ammo-therm">THER</span></td>
          <td class="burner-sensor">Radar</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">Add mission</h3>
      <input type="hidden" id="mission-id">

      <div class="form-group">
        <label>Mission name</label>
        <input type="text" id="mission-name" placeholder="e.g., Enemies Abound">
      </div>

      <div class="form-group">
        <label>Profitability</label>
        <select id="mission-color">
          <option value="bg-green">High</option>
          <option value="bg-yellow">Medium</option>
          <option value="bg-blue">Low</option>
          <option value="bg-white">Neutral</option>
          <option value="bg-orange">Special</option>
          <option value="bg-gray">No profit</option>
          <option value="bg-red">Loss</option>
        </select>
      </div>

      <div class="form-group">
        <label>Guide (room-by-room tactics / triggers)</label>
        <textarea id="mission-guide" placeholder="Pocket 1: kill the scanner post..."></textarea>
      </div>

      <div class="form-group">
        <label>Tank &amp; damage notes (enemy faction, damage type, tank advice)</label>
        <textarea id="mission-tank" class="small" placeholder="e.g., Serpentis - EM/Therm damage, shield tank recommended"></textarea>
      </div>

      <div class="form-group">
        <label>Loot &amp; salvage notes</label>
        <textarea id="mission-loot" class="small" placeholder="e.g., Faction BPCs from the last room, worth salvaging all wrecks"></textarea>
      </div>

      <div class="form-group">
        <label>Ammo types (select multiple for a split)</label>
        <div class="checkbox-group">
          <label><input type="checkbox" value="em" class="ammo-checkbox"> EM</label>
          <label><input type="checkbox" value="kin" class="ammo-checkbox"> Kinetic</label>
          <label><input type="checkbox" value="exp" class="ammo-checkbox"> Explosive</label>
          <label><input type="checkbox" value="therm" class="ammo-checkbox"> Thermal</label>
        </div>
      </div>

      <div class="form-group">
        <label>Afterburner</label>
        <select id="mission-ab">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveMission()">Save mission</button>
      </div>
    </div>
  </div>

<script>
  let missions = [];
  let filteredMissions = [];
  let expandedIds = new Set();

  const PROFIT_COLORS = {
    'bg-green': 'var(--prof-green)',
    'bg-yellow': 'var(--prof-yellow)',
    'bg-blue': 'var(--prof-blue)',
    'bg-white': 'var(--prof-white)',
    'bg-orange': 'var(--prof-orange)',
    'bg-gray': 'var(--prof-gray)',
    'bg-red': 'var(--prof-red)'
  };

  /* ---------- Tabs ---------- */
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'panel-' + name);
    });
    document.getElementById('mission-controls').style.display =
      name === 'missions' ? 'flex' : 'none';
  }

  /* ---------- Missions ---------- */
  /* Public site: mission data is read straight from the committed eve_missions.json
     next to this file. There is no backend — this is a static, read-only page for
     visitors. Editing (below) only changes the in-memory copy for this browser tab;
     use "Export JSON" to download your changes and commit them back to the repo. */
  async function fetchMissions() {
    try {
      const res = await fetch('./eve_missions.json', { cache: 'no-store' });
      if (res.ok) {
        missions = await res.json();
        missions = missions.map(m => ({
          ...m,
          id: m.id || crypto.randomUUID(),
          tank: m.tank || '',
          loot: m.loot || ''
        }));
        searchMissions();
      } else {
        throw new Error('HTTP ' + res.status);
      }
    } catch (e) {
      console.error("Error loading missions:", e);
      document.getElementById('missions-tbody').innerHTML =
        `<tr><td colspan="6" class="empty-state">Couldn't load eve_missions.json. Make sure it's in the same folder as this page.</td></tr>`;
    }
  }

  function exportMissions() {
    const blob = new Blob([JSON.stringify(missions, null, 4)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'eve_missions.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function searchMissions() {
    const query = document.getElementById('search-bar').value.toLowerCase();
    filteredMissions = missions.filter(m => m.name.toLowerCase().includes(query));
    renderTable();
  }

  function toggleExpand(id) {
    if (expandedIds.has(id)) {
      expandedIds.delete(id);
    } else {
      expandedIds.add(id);
    }
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('missions-tbody');
    if (filteredMissions.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No missions found.</td></tr>`;
      return;
    }

    tbody.innerHTML = filteredMissions.map(m => {
      const ammoDisplay = renderAmmoCell(m.ammo);
      const abClass = m.ab === 'yes' ? 'ab-yes' : 'ab-no';
      const abDisplay = m.ab === 'yes' ? 'YES' : 'NO';
      const accent = PROFIT_COLORS[m.color] || 'var(--text2)';
      const isExpanded = expandedIds.has(m.id);

      const mainRow = `
        <tr class="mission-row${isExpanded ? ' expanded' : ''}" onclick="toggleExpand('${m.id}')">
          <td class="expand-cell"><span class="chevron">&#9656;</span></td>
          <td class="mission-name-cell" style="--dot-color: ${accent};">${escapeHtml(m.name)}</td>
          <td class="guide-cell truncated">${escapeHtml(m.guide).replace(/\n/g, ' ⏵ ')}</td>
          <td class="ammo-cell">${ammoDisplay}</td>
          <td style="text-align: center;"><span class="${abClass}">${abDisplay}</span></td>
          <td style="text-align: center;">
            <div class="actions-cell" style="justify-content: center;" onclick="event.stopPropagation();">
              <button class="icon-btn edit" onclick="editMission('${m.id}')" title="Edit">✎</button>
              <button class="icon-btn delete" onclick="deleteMission('${m.id}')" title="Delete">✕</button>
            </div>
          </td>
        </tr>
      `;

      if (!isExpanded) return mainRow;

      const tankBody = m.tank
        ? `<div class="detail-body">${escapeHtml(m.tank).replace(/\n/g, '<br>')}</div>`
        : `<div class="detail-body empty">No tank/damage notes yet.</div>`;
      const lootBody = m.loot
        ? `<div class="detail-body">${escapeHtml(m.loot).replace(/\n/g, '<br>')}</div>`
        : `<div class="detail-body empty">No loot/salvage notes yet.</div>`;

      const detailRow = `
        <tr class="detail-row">
          <td colspan="6">
            <div class="detail-wrap">
              <div class="detail-section">
                <div class="detail-label tank">Tank &amp; Damage</div>
                ${tankBody}
              </div>
              <div class="detail-section">
                <div class="detail-label loot">Loot &amp; Salvage</div>
                ${lootBody}
              </div>
            </div>
          </td>
        </tr>
      `;

      return mainRow + detailRow;
    }).join('');
  }

  function renderAmmoCell(ammoArray) {
    if (!ammoArray || ammoArray.length === 0) return '<span style="color:var(--text2);">—</span>';

    const displayText = ammoArray.map(a => a.toUpperCase()).join(' / ');

    if (ammoArray.length === 1) {
      return `<span class="ammo-chip ammo-${ammoArray[0]}">${displayText}</span>`;
    }

    if (ammoArray.length === 2) {
      const c1 = `var(--ammo-${ammoArray[0]})`;
      const c2 = `var(--ammo-${ammoArray[1]})`;
      return `<span class="ammo-chip" style="background: linear-gradient(90deg, ${c1} 50%, ${c2} 50%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${displayText}</span>`;
    }

    return `<span class="ammo-chip">${displayText}</span>`;
  }

  function openModal(id = null) {
    const modal = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    document.getElementById('mission-id').value = '';
    document.getElementById('mission-name').value = '';
    document.getElementById('mission-color').value = 'bg-green';
    document.getElementById('mission-guide').value = '';
    document.getElementById('mission-tank').value = '';
    document.getElementById('mission-loot').value = '';
    document.getElementById('mission-ab').value = 'no';
    document.querySelectorAll('.ammo-checkbox').forEach(cb => cb.checked = false);

    if (id) {
      title.textContent = 'Edit mission';
      const m = missions.find(x => x.id === id);
      if (m) {
        document.getElementById('mission-id').value = m.id;
        document.getElementById('mission-name').value = m.name;
        document.getElementById('mission-color').value = m.color || 'bg-green';
        document.getElementById('mission-guide').value = m.guide || '';
        document.getElementById('mission-tank').value = m.tank || '';
        document.getElementById('mission-loot').value = m.loot || '';
        document.getElementById('mission-ab').value = m.ab || 'no';

        if (m.ammo && Array.isArray(m.ammo)) {
          m.ammo.forEach(a => {
            const cb = document.querySelector(`.ammo-checkbox[value="${a}"]`);
            if (cb) cb.checked = true;
          });
        }
      }
    } else {
      title.textContent = 'Add mission';
    }

    modal.classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  function saveMission() {
    const id = document.getElementById('mission-id').value;
    const name = document.getElementById('mission-name').value.trim();
    const color = document.getElementById('mission-color').value;
    const guide = document.getElementById('mission-guide').value.trim();
    const tank = document.getElementById('mission-tank').value.trim();
    const loot = document.getElementById('mission-loot').value.trim();
    const ab = document.getElementById('mission-ab').value;

    const ammo = Array.from(document.querySelectorAll('.ammo-checkbox:checked')).map(cb => cb.value);

    if (!name) {
      alert('Mission name is required!');
      return;
    }

    if (id) {
      const index = missions.findIndex(m => m.id === id);
      if (index !== -1) {
        missions[index] = { id, name, color, guide, tank, loot, ammo, ab };
      }
    } else {
      missions.push({ id: crypto.randomUUID(), name, color, guide, tank, loot, ammo, ab });
    }

    searchMissions();
    closeModal();
  }

  function deleteMission(id) {
    if (!confirm('Remove this mission from your working copy? (Doesn\'t affect the live site until you export + commit.)')) return;
    missions = missions.filter(m => m.id !== id);
    expandedIds.delete(id);
    searchMissions();
  }

  function editMission(id) {
    openModal(id);
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  fetchMissions();
</script>

</body>
</html>

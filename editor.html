<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Editor — Full Edit</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
// visual update only — no full re-render
<style>
  :root {
    --bg0: #090b11; --bg1: #0d1017; --bg2: #121620; --bg3: #1a1f2c;
    --border: rgba(148,163,184,0.10);
    --border-strong: rgba(148,163,184,0.22);
    --text0: #e9edf4; --text1: #8992a6; --text2: #4d5568;
    --coral: #e8917a;
    --em: #5b8fee; --kin: #7b8494; --exp: #e8917a; --therm: #db6153;
    --green: #57c98a; --red: #db6153;
    --yellow: #d9b95c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    padding: 20px 26px 80px;
    background: radial-gradient(900px 400px at 10% -10%, rgba(232,145,122,0.05), transparent 60%), var(--bg0);
    color: var(--text0);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }
  h1 { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 3px; }
  .sub { color: var(--text2); font-size: 11px; margin-bottom: 16px; }

  .bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 10px 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 9px;
    position: sticky; top: 0; z-index: 20;
  }
  button {
    background: var(--bg3);
    color: var(--text0);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #232a3a; border-color: var(--coral); }
  button.primary { background: rgba(232,145,122,0.15); border-color: var(--coral); color: var(--coral); }
  button.primary:hover { background: rgba(232,145,122,0.25); }
  button.primary.dirty {
    background: rgba(232,145,122,0.32);
    box-shadow: 0 0 0 2px rgba(232,145,122,0.18);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(232,145,122,0.18); }
    50%      { box-shadow: 0 0 0 5px rgba(232,145,122,0.05); }
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  input[type="search"], input[type="text"], textarea, select {
    background: var(--bg1);
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    padding: 5px 8px;
    color: var(--text0);
    font-family: inherit;
    font-size: 12px;
    outline: none;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--coral); }
  textarea { resize: vertical; min-height: 60px; }

  .status { margin-left: auto; font-size: 11px; color: var(--text1); }
  .status.ok  { color: var(--green); }
  .status.err { color: var(--red); }
  .status.dirty { color: var(--coral); }

  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--bg1); border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border);
    table-layout: fixed;
  }
  th, td { padding: 6px 8px; text-align: left; vertical-align: middle; }
  th {
    background: var(--bg2); color: var(--text2);
    font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border-strong);
  }
  tbody tr.mission-row { border-bottom: 1px solid var(--border); }
  tbody tr.mission-row:hover { background: rgba(255,255,255,0.02); }
  tbody tr.mission-row.expanded { background: rgba(232,145,122,0.05); }
  tbody tr.detail-row > td { background: var(--bg2); padding: 0; border-bottom: 1px solid var(--border-strong); }

  .chev-cell { width: 26px; text-align: center; cursor: pointer; color: var(--text2); user-select: none; font-size: 10px; }
  .chev-cell:hover { color: var(--coral); }
  tr.mission-row.expanded .chev-cell { color: var(--coral); }

  .id-cell { width: 42px; color: var(--text2); font-size: 10.5px; text-align: right; }
  .name-cell { width: 22%; }
  .name-cell input { padding: 4px 6px; font-size: 12px; }
  .color-cell { width: 34px; text-align: center; cursor: pointer; }
  .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 8px var(--dot); background: var(--dot); }
  .resist-cell, .ammo-cell { width: 200px; }
  .ab-cell { width: 42px; text-align: center; cursor: pointer; }
  .ab-pill {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
    border: 1px solid var(--text2); color: var(--text2);
  }
  .ab-pill.yes { border-color: var(--coral); color: var(--coral); background: rgba(232,145,122,0.10); }
  .choice-cell { width: 50px; text-align: center; cursor: pointer; }
  .star { font-size: 14px; color: var(--text2); user-select: none; }
  .star.on { color: var(--yellow); text-shadow: 0 0 8px rgba(217,185,92,0.5); }
  .tags-cell { width: 120px; }
  .profit-cell { width: 90px; }
  .profit-cell input { padding: 3px 6px; font-size: 11px; }

  .chk-group { display: flex; gap: 3px; flex-wrap: wrap; }
  .chk {
    display: inline-flex; align-items: center;
    padding: 2px 6px; border-radius: 4px;
    background: var(--bg3); border: 1px solid transparent;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em;
    cursor: pointer; user-select: none;
    color: var(--text2);
    transition: all 0.1s;
  }
  .chk:hover { border-color: var(--border-strong); }
  .chk.checked { background: rgba(255,255,255,0.06); color: var(--text0); }
  .chk.checked[data-type="em"]    { color: var(--em);    border-color: var(--em); }
  .chk.checked[data-type="kin"]   { color: var(--kin);   border-color: var(--kin); }
  .chk.checked[data-type="exp"]   { color: var(--exp);   border-color: var(--exp); }
  .chk.checked[data-type="therm"] { color: var(--therm); border-color: var(--therm); }

  .tag-chips { display: flex; gap: 3px; flex-wrap: wrap; }
  .tag-mini {
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.07em;
    padding: 1px 5px; border-radius: 3px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .tag-mini.skip  { color: var(--red);    background: rgba(219,97,83,0.10); }
  .tag-mini.blitz { color: var(--coral);  background: rgba(232,145,122,0.10); }
  .tag-mini.fast  { color: var(--em);     background: rgba(91,143,238,0.10); }
  .tag-mini.other { color: var(--text2);  background: rgba(148,163,184,0.08); }

  /* Expanded detail */
  .detail { padding: 14px 16px 16px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .detail-grid .field label { display: block; color: var(--text2); font-size: 10px; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 600; }
  .detail-field { margin-bottom: 10px; }
  .detail-field label { display: block; color: var(--text2); font-size: 10px; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 600; }
  .detail-field.guide label { color: var(--coral); }
  .detail-field.tank label { color: var(--coral); }
  .detail-field.loot label { color: var(--green); }

  .tag-editor { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tag-toggle {
    padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; cursor: pointer; user-select: none;
    background: var(--bg3); border: 1px solid transparent; color: var(--text2);
  }
  .tag-toggle:hover { border-color: var(--border-strong); }
  .tag-toggle.on[data-tag="SKIP"]  { color: var(--red);    border-color: var(--red);    background: rgba(219,97,83,0.10); }
  .tag-toggle.on[data-tag="BLITZ"] { color: var(--coral);  border-color: var(--coral);  background: rgba(232,145,122,0.10); }
  .tag-toggle.on[data-tag="FAST"]  { color: var(--em);     border-color: var(--em);     background: rgba(91,143,238,0.10); }

  .row-count { color: var(--text2); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>

  <h1>Mission Editor — Full Edit</h1>
  <div class="sub">Edit everything inline. Click ▸ to expand a mission for long-form fields. Save when done.</div>

  <div class="bar">
    <button id="load-btn">Load JSON…</button>
    <button id="save-btn" class="primary" disabled>Save</button>
    <button id="expand-all">Expand All</button>
    <button id="collapse-all">Collapse All</button>
    <input type="search" id="search" placeholder="Filter missions…" style="width: 220px;">
    <span class="status" id="status">No file loaded</span>
  </div>

  <table>
    <colgroup>
      <col style="width: 26px;">
      <col style="width: 42px;">
      <col style="width: 22%;">
      <col style="width: 34px;">
      <col style="width: 200px;">
      <col style="width: 200px;">
      <col style="width: 42px;">
      <col style="width: 50px;">
      <col style="width: 120px;">
      <col style="width: 90px;">
    </colgroup>
    <thead>
      <tr>
        <th></th>
        <th style="text-align:right;">#</th>
        <th>Name</th>
        <th title="Color tier">C</th>
        <th>Resistances</th>
        <th>Ammo</th>
        <th>AB</th>
        <th title="Neks' Choice">★</th>
        <th>Tags</th>
        <th>Profit</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="10" style="color: var(--text2); text-align: center; padding: 30px;">Load a JSON file to begin</td></tr>
    </tbody>
  </table>

  <div class="row-count" id="row-count"></div>

<script>
  const TYPES = ['em', 'kin', 'exp', 'therm'];
  const TAGS_PRESET = ['SKIP', 'BLITZ', 'FAST'];
  const COLORS = [
    { v: 'bg-green',  hex: '#57c98a' },
    { v: 'bg-blue',   hex: '#5b8fee' },
    { v: 'bg-yellow', hex: '#d9b95c' },
    { v: 'bg-white',  hex: '#7b8494' },
    { v: 'bg-orange', hex: '#e8917a' },
    { v: 'bg-gray',   hex: '#454c5c' },
    { v: 'bg-red',    hex: '#db6153' },
  ];

  let missions = [];
  let fileHandle = null;
  let isDirty = false;
  let expandedIds = new Set();

  const $ = id => document.getElementById(id);
  const tbody = $('tbody');
  const statusEl = $('status');
  const searchEl = $('search');
  const rowCountEl = $('row-count');
  const saveBtn = $('save-btn');

  function setStatus(text, cls = '') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + cls;
  }
  function markDirty() {
    if (isDirty) return;
    isDirty = true;
    saveBtn.classList.add('dirty');
    saveBtn.textContent = 'Save •';
    setStatus('Unsaved changes', 'dirty');
  }
  function markClean(msg = 'Saved ✓') {
    isDirty = false;
    saveBtn.classList.remove('dirty');
    saveBtn.textContent = 'Save';
    setStatus(msg, 'ok');
  }
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }
  function escapeAttr(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* ---------- Load ---------- */

  async function loadFile() {
    if (window.showOpenFilePicker) {
      try {
        [fileHandle] = await window.showOpenFilePicker({
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
        });
        const file = await fileHandle.getFile();
        await readFile(file);
        saveBtn.disabled = false;
        markClean('Loaded: ' + file.name);
      } catch (e) {
        if (e.name !== 'AbortError') setStatus('Load failed: ' + e.message, 'err');
      }
    } else {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.onchange = async () => {
        if (!input.files[0]) return;
        await readFile(input.files[0]);
        fileHandle = null;
        saveBtn.disabled = false;
        markClean('Loaded: ' + input.files[0].name + ' (download mode)');
      };
      input.click();
    }
  }

  async function readFile(file) {
    const text = await file.text();
    missions = JSON.parse(text);
    normalize();
    render();
  }

  function normalize() {
    for (const m of missions) {
      if (!Array.isArray(m.resist)) m.resist = [];
      if (!Array.isArray(m.ammo))   m.ammo   = [];
      if (!Array.isArray(m.tags))   m.tags   = [];
      m.resist = m.resist.filter(t => t !== 'x');
      m.ammo   = m.ammo.filter(t => t !== 'x');
      if (typeof m.choice !== 'boolean') m.choice = false;
      if (typeof m.ab !== 'string') m.ab = 'no';
      ['guide','tank','loot','profit','name','color'].forEach(k => {
        if (m[k] == null) m[k] = '';
      });
    }
  }

  /* ---------- Render ---------- */

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const list = q ? missions.filter(m => m.name.toLowerCase().includes(q)) : missions;

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="10" style="color: var(--text2); text-align: center; padding: 30px;">No missions match.</td></tr>';
      rowCountEl.textContent = '';
      return;
    }

    tbody.innerHTML = list.map(m => {
      const idx = missions.indexOf(m);
      const isExp = expandedIds.has(m.id);
      const color = COLORS.find(c => c.v === m.color) || COLORS[3];
      const tags = m.tags.map(t => {
        const k = t.toLowerCase();
        const cls = ['skip','blitz','fast'].includes(k) ? k : 'other';
        return `<span class="tag-mini ${cls}">${escapeHtml(t)}</span>`;
      }).join('');

      const compact = `
        <tr class="mission-row${isExp ? ' expanded' : ''}">
          <td class="chev-cell" onclick="toggleExpand('${escapeAttr(m.id)}')">${isExp ? '▾' : '▸'}</td>
          <td class="id-cell">${escapeHtml(m.id)}</td>
          <td class="name-cell">
            <input type="text" value="${escapeAttr(m.name)}"
              oninput="onTextInput(event, ${idx}, 'name')">
          </td>
          <td class="color-cell" onclick="cycleColor(${idx})" title="Click to cycle color tier">
            <span class="color-dot" style="--dot:${color.hex};"></span>
          </td>
          <td class="resist-cell">${renderChecks(idx, 'resist', m.resist)}</td>
          <td class="ammo-cell">${renderChecks(idx, 'ammo',   m.ammo)}</td>
          <td class="ab-cell" onclick="toggleAB(${idx})" title="Toggle afterburner">
            <span class="ab-pill${m.ab === 'yes' ? ' yes' : ''}">${m.ab === 'yes' ? 'YES' : 'NO'}</span>
          </td>
          <td class="choice-cell" onclick="toggleChoice(${idx})" title="Toggle Neks' Choice">
            <span class="star${m.choice ? ' on' : ''}">${m.choice ? '★' : '☆'}</span>
          </td>
          <td class="tags-cell">${tags || '<span style="color:var(--text2);font-size:10px;">—</span>'}</td>
          <td class="profit-cell">
            <input type="text" value="${escapeAttr(m.profit)}"
              oninput="onTextInput(event, ${idx}, 'profit')"
              placeholder="—">
          </td>
        </tr>
      `;

      if (!isExp) return compact;
      return compact + expandedRow(m, idx);
    }).join('');

    rowCountEl.textContent = `${list.length} / ${missions.length} missions shown`;
  }

  function renderChecks(idx, field, values) {
    const set = new Set(values.map(v => v.toLowerCase()));
    return `<div class="chk-group">` + TYPES.map(t => {
      const on = set.has(t);
      return `<span class="chk${on ? ' checked' : ''}" data-type="${t}"
        onclick="toggleType(${idx}, '${field}', '${t}', event)">${t.toUpperCase()}</span>`;
    }).join('') + `</div>`;
  }

  function expandedRow(m, idx) {
    const tagsOn = new Set(m.tags.map(t => t.toUpperCase()));
    const tagBtns = TAGS_PRESET.map(t =>
      `<span class="tag-toggle${tagsOn.has(t) ? ' on' : ''}" data-tag="${t}"
        onclick="toggleTag(${idx}, '${t}', event)">${t}</span>`
    ).join('');

    return `
      <tr class="detail-row">
        <td colspan="10">
          <div class="detail">
            <div class="detail-grid">
              <div class="field">
                <label>Color tier</label>
                <select onchange="onTextInput(event, ${idx}, 'color')">
                  ${COLORS.map(c => `<option value="${c.v}" ${c.v === m.color ? 'selected' : ''}>${c.v} — ${tierName(c.v)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>AB (afterburner)</label>
                <select onchange="onTextInput(event, ${idx}, 'ab')">
                  <option value="no"  ${m.ab === 'no'  ? 'selected' : ''}>no</option>
                  <option value="yes" ${m.ab === 'yes' ? 'selected' : ''}>yes</option>
                </select>
              </div>
              <div class="field">
                <label>Neks' Choice</label>
                <select onchange="onBoolInput(event, ${idx}, 'choice')">
                  <option value="false" ${!m.choice ? 'selected' : ''}>no</option>
                  <option value="true"  ${m.choice  ? 'selected' : ''}>yes</option>
                </select>
              </div>
            </div>

            <div class="detail-field">
              <label>Tags</label>
              <div class="tag-editor">${tagBtns}</div>
            </div>

            <div class="detail-field guide">
              <label>Guide</label>
              <textarea oninput="onTextInput(event, ${idx}, 'guide')"
                placeholder="Tactics, pockets, triggers…">${escapeHtml(m.guide)}</textarea>
            </div>

            <div class="detail-grid">
              <div class="detail-field tank">
                <label>Tank &amp; damage</label>
                <textarea oninput="onTextInput(event, ${idx}, 'tank')"
                  placeholder="What to tank, DPS types…">${escapeHtml(m.tank)}</textarea>
              </div>
              <div class="detail-field loot">
                <label>Loot &amp; salvage</label>
                <textarea oninput="onTextInput(event, ${idx}, 'loot')"
                  placeholder="Faction modules, tags, salvage notes…">${escapeHtml(m.loot)}</textarea>
              </div>
            </div>
          </div>
        </td>
      </tr>
    `;
  }

  function tierName(v) {
    return ({
      'bg-green':  'Apex',
      'bg-blue':   'Prime',
      'bg-yellow': 'Marginal',
      'bg-white':  'Stand Down',
      'bg-orange': 'Special',
      'bg-gray':   'No profit',
      'bg-red':    'Loss',
    })[v] || v;
  }

  /* ---------- Interactions ---------- */

  window.toggleExpand = function(id) {
    if (expandedIds.has(id)) expandedIds.delete(id);
    else expandedIds.add(id);
    render();
  };

  window.toggleType = function(idx, field, type, ev) {
    const m = missions[idx];
    const arr = m[field];
    const pos = arr.findIndex(v => v.toLowerCase() === type);
    if (pos === -1) arr.push(type);
    else arr.splice(pos, 1);

    // visual update only — no full re-render
    const el = ev.currentTarget;
    el.classList.toggle('checked', pos === -1);
    markDirty();
  };

  window.toggleAB = function(idx) {
    missions[idx].ab = missions[idx].ab === 'yes' ? 'no' : 'yes';
    markDirty();
    // cheap visual: toggle classes without full re-render
    render();
  };

  window.toggleChoice = function(idx) {
    missions[idx].choice = !missions[idx].choice;
    markDirty();
    render();
  };

  window.toggleTag = function(idx, tag, ev) {
    const m = missions[idx];
    const upper = m.tags.map(t => t.toUpperCase());
    const pos = upper.indexOf(tag);
    if (pos === -1) m.tags.push(tag);
    else m.tags.splice(pos, 1);
    ev.currentTarget.classList.toggle('on');
    markDirty();
    // Update the mini chips in the compact row (without a full re-render)
    // Simpler: just re-render this one row's tags cell
    const row = ev.currentTarget.closest('tr.detail-row').previousElementSibling;
    if (row) {
      const tagsCell = row.querySelector('.tags-cell');
      const tags = m.tags.map(t => {
        const k = t.toLowerCase();
        const cls = ['skip','blitz','fast'].includes(k) ? k : 'other';
        return `<span class="tag-mini ${cls}">${escapeHtml(t)}</span>`;
      }).join('');
      tagsCell.innerHTML = tags || '<span style="color:var(--text2);font-size:10px;">—</span>';
    }
  };

  window.cycleColor = function(idx) {
    const m = missions[idx];
    const pos = COLORS.findIndex(c => c.v === m.color);
    const next = COLORS[(pos + 1) % COLORS.length];
    m.color = next.v;
    markDirty();
    render();
  };

  window.onTextInput = function(ev, idx, field) {
    missions[idx][field] = ev.target.value;
    markDirty();
    // Don't re-render — the input already holds the value
  };

  window.onBoolInput = function(ev, idx, field) {
    missions[idx][field] = ev.target.value === 'true';
    markDirty();
  };

  /* ---------- Manual Save ---------- */

  async function saveNow() {
    if (!missions.length) return;
    const text = JSON.stringify(missions, null, 4);

    if (fileHandle) {
      try {
        const writable = await fileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        markClean('Saved ✓ ' + new Date().toLocaleTimeString());
      } catch (e) {
        setStatus('Save failed: ' + e.message, 'err');
      }
    } else {
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'eve_missions.json';
      a.click();
      URL.revokeObjectURL(url);
      markClean('Downloaded — replace your file');
    }
  }

  /* ---------- Wire-up ---------- */

  $('load-btn').addEventListener('click', loadFile);
  saveBtn.addEventListener('click', saveNow);
  searchEl.addEventListener('input', render);

  $('expand-all').addEventListener('click', () => {
    missions.forEach(m => expandedIds.add(m.id));
    render();
  });
  $('collapse-all').addEventListener('click', () => {
    expandedIds.clear();
    render();
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      if (!saveBtn.disabled) saveNow();
    }
  });

  window.addEventListener('beforeunload', e => {
    if (isDirty) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- Preview (read-only) ---------- */

  fetch('./eve_missions.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && !missions.length) {
        missions = data;
        normalize();
        render();
        setStatus('Preview only — click "Load JSON…" to edit & save');
      }
    })
    .catch(() => {});
</script>

</body>
</html>
